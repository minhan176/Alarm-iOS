name: clock_os_26
description: "Alarm Phone 17 OS 26 - Liquid Glass UI"
publish_to: 'none'
version: 1.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  android_alarm_manager_plus: ^4.0.5
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  audioplayers: ^6.1.0
  vibration: ^2.0.0
  liquid_glass_renderer: ^0.2.0-dev.4
  oc_liquid_glass: ^0.2.1
  flutter_hooks: ^0.21.2
  motor: ^1.0.0-dev.3
  modal_bottom_sheet: ^3.0.0
  file_picker: ^10.3.8
  permission_handler: ^11.3.1
  android_intent_plus: ^5.0.0
  fluttertoast: ^8.2.6
  jbh_ringtone: ^1.0.3
  url_launcher: ^6.3.0
  share_plus: ^10.0.2
  store_redirect: ^2.0.2
  device_info_plus: ^10.1.0
  in_app_review: ^2.0.11
  in_app_purchase: ^3.2.3
  google_mobile_ads: ^5.1.0
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.woff2
          weight: 400

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/ic_launcher.jpg"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/ic_launcher.jpg"
  android_adaptive_background: "#000000"
  android_adaptive_foreground: "assets/ic_launcher.jpg"
