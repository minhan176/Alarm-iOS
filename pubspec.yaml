name: alarm
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  android_alarm_manager_plus: ^4.0.5
  flutter_local_notifications: ^18.0.1
